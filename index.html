/* Carta batimétrica nocturna: los tableros ocupan el centro; los menús son órdenes de navegación alineadas a la izquierda */
:root{
  color-scheme:dark;
  --sea:#0b2230;--sea2:#0f2f40;--sea3:#16405a;--deep:#071820;--contour:#2b5f73;
  --bone:#e9efe9;--mist:#93aeb8;--signal:#ffc93c;--flag:#e8492f;--navy:#2f6fd6;--kelp:#5fd3a8;--ink:#071820;
  --display:'Big Shoulders Stencil Display','Arial Narrow',Impact,sans-serif;
  --ui:'Schibsted Grotesk','Segoe UI',system-ui,sans-serif;
  --gx:clamp(14px,1.5vw,22px);--gy:clamp(11px,1.2vw,16px);
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --cut:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;background:var(--sea);overflow:hidden;font-family:var(--ui);color:var(--bone);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;overflow:hidden;background:var(--sea)}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

/* ───── Pausa ───── */
.gbtn{position:absolute;display:none;place-items:center;background:var(--sea2);border:1px solid var(--contour);color:var(--bone);cursor:pointer;z-index:6;
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%);transition:background .12s}
.gbtn:hover{background:var(--sea3)}
.gbtn svg{width:46%;height:46%}
#pauseBtn{top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 12px);width:clamp(42px,6vh,56px);height:clamp(42px,6vh,56px)}
#stage.ingame #pauseBtn{display:grid}

/* ───── Consola inferior de juego ───── */
#bar{position:absolute;left:0;right:0;bottom:0;z-index:5;display:none;pointer-events:none;
  padding:10px max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(12px,env(safe-area-inset-left,0px));
  background:linear-gradient(0deg,rgba(7,24,32,.97),rgba(7,24,32,.86) 72%,rgba(7,24,32,0));font-size:clamp(13px,1.9vh,17px)}
#stage.ingame #bar{display:block}
#barIn{display:flex;flex-wrap:wrap;gap:.5em .6em;align-items:center;justify-content:center;pointer-events:auto;max-width:1200px;margin:0 auto}
.dock{display:flex;gap:.4em;flex-wrap:wrap;justify-content:center}
.shipbtn{display:flex;flex-direction:column;align-items:flex-start;gap:.15em;cursor:pointer;background:var(--sea2);border:1px solid var(--contour);border-top:3px solid var(--contour);padding:.35em .6em .4em;color:var(--bone);font:700 .86em var(--ui);letter-spacing:.03em;text-transform:uppercase;min-width:6.4em}
.shipbtn canvas{width:5.2em;height:1.2em;display:block}
.shipbtn small{font:500 .72em var(--mono);color:var(--mist);letter-spacing:.04em;text-transform:none}
.shipbtn.sel{border-top-color:var(--signal);background:var(--sea3)}
.shipbtn.done{opacity:.5;border-style:dashed}
.shipbtn:hover{border-color:var(--mist)}
.pbtn{display:inline-grid;grid-template-columns:auto auto 1fr;align-items:center;gap:.55em;cursor:pointer;background:var(--sea2);border:1px solid var(--contour);padding:.4em .9em .4em .5em;color:var(--bone);font:700 .96em var(--ui);letter-spacing:.035em;text-transform:uppercase;text-align:left;
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%)}
.pbtn .gauge{width:.55em;height:2.5em;background:rgba(233,239,233,.12);position:relative;overflow:hidden}
.pbtn .gauge i{position:absolute;left:0;right:0;bottom:0;height:calc(var(--p,0)*1%);background:var(--signal);transition:height .3s}
.pbtn .ico{width:2em;height:2em;display:grid;place-items:center;border:1px solid var(--contour)}
.pbtn .ico svg{width:1.2em;height:1.2em}
.pbtn small{display:block;font:500 .72em var(--mono);letter-spacing:.04em;text-transform:none;color:var(--mist)}
.pbtn.ready{border-color:var(--signal);animation:pready 1.1s ease-in-out infinite}
.pbtn.ready .ico{background:var(--signal);color:var(--ink);border-color:var(--signal)}
.pbtn.off{opacity:.55;cursor:not-allowed}
.pbtn.aim{border-color:var(--kelp);background:#123c3a}
@keyframes pready{50%{background:var(--sea3)}}
.log{flex:1 1 16em;min-width:0;max-width:32em;text-align:left;font:500 .82em/1.45 var(--mono);border-left:2px solid var(--contour);padding-left:.7em}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log div:nth-child(1){color:var(--bone)}
.log div:nth-child(2){color:var(--mist);opacity:.85}
.log div:nth-child(3){color:var(--mist);opacity:.5}
.hint{color:var(--mist);font:500 .74em var(--mono);text-align:center;flex-basis:100%}

/* ───── Capa de menús ───── */
#ov{position:absolute;inset:0;display:none;overflow-y:auto;overflow-x:hidden;z-index:8;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(90deg,rgba(7,24,32,.95),rgba(7,24,32,.82) 55%,rgba(7,24,32,.62));
  backdrop-filter:blur(2px);font-size:clamp(14px,min(2.3vh,4.1vw),21px);touch-action:pan-y}
#ov.show{display:block}
#ov.clear{background:linear-gradient(90deg,rgba(7,24,32,.86),rgba(7,24,32,.45) 60%,rgba(7,24,32,.15))}
#ov.solid{background:var(--deep)}
#ov::-webkit-scrollbar{width:8px}#ov::-webkit-scrollbar-thumb{background:var(--contour)}
.scr.wide{width:min(100%,86em)}
.scr{width:min(100%,62em);margin:0 auto;display:flex;flex-direction:column;gap:1.05em;padding-block:clamp(12px,3vh,34px)}
.topbar{display:flex;align-items:flex-end;gap:.8em;border-bottom:1px solid var(--contour);padding-bottom:.55em;flex-wrap:wrap}
.topbar h2{font:900 clamp(32px,6.4vh,66px)/.88 var(--display);letter-spacing:.015em;text-transform:uppercase;color:var(--bone);flex:1;min-width:0;text-wrap:balance}
.topbar h2 small{display:block;font:500 .22em var(--mono);letter-spacing:.2em;color:var(--signal);margin-bottom:.55em}
.iconbtn{width:2.5em;height:2.5em;flex:none;display:grid;place-items:center;background:var(--sea2);border:1px solid var(--contour);color:var(--bone);cursor:pointer;margin-bottom:.2em}
.iconbtn:hover{border-color:var(--signal)}
.iconbtn svg{width:1.2em;height:1.2em}
h3.s{display:flex;align-items:center;gap:.6em;font:700 1.02em/1.2 var(--ui);color:var(--bone);letter-spacing:0;margin:.5em 0 .05em}
h3.s::before{content:'';width:.5em;height:.5em;background:var(--signal);flex:none;transform:rotate(45deg)}
h3.s::after{content:'';flex:1;border-top:1px solid var(--contour)}
.txt{font:400 .95em/1.5 var(--ui);color:var(--mist);letter-spacing:0;max-width:66ch}
.txt b,.hl{color:var(--bone);font-weight:700}
.cy{color:var(--bone)}.pk{color:var(--flag)}.lm{color:var(--kelp)}.am{color:var(--signal)}.rd{color:var(--flag)}

/* Portada */
.title{min-height:100%;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.85fr);gap:clamp(16px,4vw,64px);align-items:center;width:min(100%,76em);margin:0 auto;padding-block:clamp(48px,7vh,72px) clamp(16px,4vh,40px)}
@media (max-width:860px){.title{grid-template-columns:1fr;padding-top:24px}}
.brand{display:flex;align-items:center;gap:clamp(12px,2.2vw,28px)}

@media (prefers-reduced-motion:reduce){.pbtn.ready,.sound .scale i{animation:none!important}.sound .scale i{width:100%}}

/* ───── Manual: láminas ───── */
.manual{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(10px,1.2vw,16px)}
.plate{grid-column:span 12;position:relative;text-align:left;background:linear-gradient(180deg,rgba(15,47,64,.92),rgba(11,34,48,.92));border:1px solid var(--contour);padding:calc(var(--gy) + 4px) calc(var(--gx) + 2px);display:flex;flex-direction:column;gap:.7em;min-width:0}
.plate h4{font:900 1.7em/1 var(--display);text-transform:uppercase;letter-spacing:.02em;color:var(--bone);margin:0}
.plate p{font:400 .92em/1.45 var(--ui);color:var(--mist);margin:0;max-width:60ch}
.plate .pnum{position:absolute;top:.5em;right:.7em;font:900 3.2em/1 var(--display);color:transparent;-webkit-text-stroke:1px rgba(255,201,60,.55)}
.plate.hero{background:linear-gradient(120deg,rgba(255,201,60,.13),transparent 55%),linear-gradient(180deg,rgba(15,47,64,.92),rgba(11,34,48,.92));border-color:rgba(255,201,60,.45)}
.plate.hero h4{font-size:clamp(1.8em,3.4vw,2.7em);max-width:30ch;text-wrap:balance}
.plate .lead{font-size:1.02em;color:var(--bone)}
.plate.step{grid-column:span 4}.plate.marks{grid-column:span 5}.plate.modes{grid-column:span 7}.plate.adm{grid-column:span 7}.plate.pts{grid-column:span 5}
.plate.pts .formula{flex:1;justify-content:space-around}
svg.mini{width:100%;max-width:220px;height:auto;display:block}
.plate.step svg.mini{align-self:center;max-width:200px}
.fleetline{display:flex;flex-wrap:wrap;gap:1em 1.6em;align-items:flex-end}
.fleetline .fl{display:flex;flex-direction:column;gap:.3em}
.fleetline .cells{display:flex;gap:3px}.fleetline .cells i{width:clamp(18px,2.2vw,28px);aspect-ratio:1;background:#a9b6bb;border:1px solid var(--bone)}
.fleetline .cells i:first-child{border-radius:40% 4px 4px 40%}.fleetline .cells i:last-child{border-radius:4px 50% 50% 4px}
.fleetline b{font:700 .95em var(--ui);color:var(--bone)}.fleetline span{font:500 .72em var(--mono);color:var(--mist)}
.kbwrap{overflow-x:auto;margin-inline:calc(-1 * var(--gx));padding-inline:var(--gx);padding-bottom:4px}
svg.kb{width:100%;min-width:600px;height:auto;display:block;max-width:1100px;margin:0 auto}
svg.kb .k rect,svg.kb .k path{fill:rgba(7,24,32,.7);stroke:rgba(147,174,184,.35);stroke-width:1.2}
svg.kb .k text{fill:rgba(147,174,184,.55);font-family:var(--mono);font-weight:600}
svg.kb .k.on rect,svg.kb .k.on path{fill:var(--kc);stroke:var(--kc);filter:drop-shadow(0 3px 0 rgba(0,0,0,.5))}
svg.kb .k.on text{fill:#071820}
svg.kb[data-hl] .k.on:not([data-g="x"]) rect{opacity:1}
svg.kb[data-hl]:not([data-hl=""]) .k.on rect,svg.kb[data-hl]:not([data-hl=""]) .k.on path{opacity:.3}
svg.kb[data-hl="move"] .k[data-g="move"] rect,svg.kb[data-hl="fire"] .k[data-g="fire"] rect,svg.kb[data-hl="fire"] .k[data-g="fire"] path,svg.kb[data-hl="ship"] .k[data-g="ship"] rect,svg.kb[data-hl="rot"] .k[data-g="rot"] rect,svg.kb[data-hl="pow"] .k[data-g="pow"] rect,svg.kb[data-hl="salvo"] .k[data-g="salvo"] rect,svg.kb[data-hl="visor"] .k[data-g="visor"] rect,svg.kb[data-hl="pause"] .k[data-g="pause"] rect{opacity:1}
svg.kb .k.hit rect,svg.kb .k.hit path{animation:khit .5s ease-out}
@keyframes khit{0%{transform:translateY(3px);fill:#fff}100%{transform:none}}
svg.kb .k{transform-box:fill-box}
.plate .hint{font:500 .8em var(--mono);color:var(--signal);min-height:1.4em}
.kleg{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15em),1fr));gap:.45em 1.2em}
.kleg li{display:flex;align-items:center;gap:.55em;font:500 .9em var(--ui);color:var(--bone);cursor:default}
.kleg i{width:1.1em;height:1.1em;background:var(--kc);flex:none;border-radius:3px}
.touch{display:flex;flex-wrap:wrap;gap:.5em 1.4em;font:500 .86em var(--ui);color:var(--mist)}.touch span{display:inline-flex;align-items:center;gap:.4em}
.legend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.7em}
.legend>div{display:flex;flex-direction:column;align-items:center;gap:.4em;text-align:center}
.legend svg.mini{width:3.2em}.legend span{font:500 .78em/1.2 var(--ui);color:var(--bone)}
.mtiles,.atiles,.aitiles{display:grid;gap:.6em}
.mtiles{grid-template-columns:repeat(auto-fill,minmax(min(100%,9.5em),1fr))}
.mtiles>div,.atiles>div,.aitiles>div{display:flex;flex-direction:column;gap:.25em;background:rgba(7,24,32,.5);padding:.75em .8em;min-width:0}
.mtiles b,.atiles b,.aitiles b{font:700 .95em/1.2 var(--ui);color:var(--bone)}
.mtiles span,.atiles span,.aitiles span{font:400 .8em/1.35 var(--ui);color:var(--mist)}
.atiles{grid-template-columns:repeat(auto-fill,minmax(min(100%,7.4em),1fr))}
.atiles>div{align-items:center;text-align:center}
.charge{display:grid;grid-template-columns:auto 1fr;gap:.35em .8em;align-items:center;font:500 .8em var(--ui);color:var(--mist)}
.charge i{height:.55em;background:linear-gradient(90deg,var(--signal) var(--w),rgba(233,239,233,.12) var(--w))}
.formula{display:flex;flex-direction:column;gap:.55em}
.formula>div{display:grid;grid-template-columns:4.2em 1fr;gap:.8em;align-items:baseline}
.formula b{font:900 1.5em/1 var(--display);color:var(--signal)}
.formula span{font:400 .88em/1.35 var(--ui);color:var(--mist)}
.formula .eq{border-top:1px dashed var(--contour);padding-top:.6em;align-items:center;grid-template-columns:auto 1fr}
.formula .eq svg{width:1.6em;height:1.6em;color:var(--signal)}
.aitiles{grid-template-columns:repeat(3,minmax(0,1fr))}
.aitiles svg.mini{max-width:8.5em}
.aitiles>div{display:grid;grid-template-columns:minmax(0,8.5em) 1fr;column-gap:.9em;align-items:center}.aitiles svg.mini{grid-row:1/span 2}
@media (max-width:900px){.plate.step{grid-column:span 12}.plate.marks,.plate.modes,.plate.adm,.plate.pts{grid-column:span 12}.plate.step{display:grid;grid-template-columns:minmax(0,9em) 1fr;align-items:center}.plate.step h4{grid-column:2}.plate.step svg.mini{grid-row:1/span 2}}
@media (max-width:900px){.aitiles{grid-template-columns:1fr}.aitiles>div{grid-template-columns:5em 1fr}}
@media (max-width:520px){.legend{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){svg.kb .k.hit rect,svg.kb .k.hit path{animation:none}}

/* ───── En línea ───── */
.btn.main svg.iso{fill:var(--ink)}.btn.main svg.iso .a{fill:var(--ink);stroke:var(--ink)}.btn.main svg.iso .a.s,.btn.main svg.iso .s{fill:none;stroke:var(--ink)}
svg.iso{width:1.7em;height:1.7em}
.order.net{border-color:var(--signal);background:linear-gradient(90deg,rgba(255,201,60,.14),rgba(15,47,64,.9) 60%)}
.lobby{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,1.2vw,16px)}
.lobby .plate{grid-column:auto}
.lobby .netst,.lobby .how{grid-column:1/-1}
.lobby .panel{padding-block:0}
.pinbig{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.4em;max-width:24em}
.pinbig i,.pinbig b{aspect-ratio:3/4;display:grid;place-items:center;border:1px solid var(--contour);background:rgba(7,24,32,.6)}
.pinbig b{font:900 clamp(1.8em,4vw,2.8em)/1 var(--display);color:var(--signal);border-color:var(--signal);animation:pinIn .35s both}
.pinbig b:nth-child(2){animation-delay:.05s}.pinbig b:nth-child(3){animation-delay:.1s}.pinbig b:nth-child(4){animation-delay:.15s}.pinbig b:nth-child(5){animation-delay:.2s}.pinbig b:nth-child(6){animation-delay:.25s}
@keyframes pinIn{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.netinv:empty{display:none}.netinv{display:grid;grid-template-columns:7em minmax(0,1fr);gap:1em;align-items:center}
.invqr{background:#e9efe9;padding:.45em;line-height:0}.invqr svg{width:100%;height:auto}
.invtx{display:flex;flex-direction:column;gap:.5em;min-width:0}.invtx b{font:700 .95em var(--ui);color:var(--bone)}
.invtx input.url{font:500 .78em var(--mono);text-transform:none;letter-spacing:0;width:100%;max-width:none;color:var(--mist)}
.invtx .btn{align-self:flex-start}
.pinin{font:900 clamp(1.7em,4vw,2.4em)/1 var(--display);letter-spacing:.42em;text-align:center;padding:.3em .2em .3em .6em;background:rgba(7,24,32,.7);border:1px solid var(--contour);color:var(--signal);width:100%;max-width:12em;
  background-image:repeating-linear-gradient(90deg,transparent 0 calc(100%/6 - 1px),rgba(43,95,115,.7) calc(100%/6 - 1px) calc(100%/6))}
.pinin:focus{outline:2px solid var(--signal);outline-offset:2px}
.lobby .plate .btn{align-self:flex-start}
.netst{display:flex;align-items:center;gap:.8em;padding:.8em var(--gx);border:1px solid var(--contour);background:rgba(7,24,32,.6);font:600 .95em var(--ui);color:var(--mist)}
.netst i{width:.9em;height:.9em;border-radius:50%;background:var(--mist);flex:none;position:relative}
.netst.wait i,.netst.conn i{background:var(--signal)}.netst.ok i{background:var(--kelp)}.netst.err i{background:var(--flag)}
.netst.wait i::after,.netst.conn i::after{content:'';position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--signal);animation:ping 1.6s ease-out infinite}
.netst.ok{color:var(--bone);border-color:var(--kelp)}.netst.err{color:var(--bone);border-color:var(--flag)}
@keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(3.2);opacity:0}}
@media (max-width:760px){.lobby{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.netst i::after,.pinbig b{animation:none}}
</style>
</head>

  <div id="bar"><div id="barIn"></div></div>
  <div id="ov"></div>
  <div id="cf"></div>
</div>

  if(MUS.timer||!AU)return;MUS.nextT=AU.currentTime+.1;
  MUS.timer=setInterval(()=>{
    if(!AU)return;if(SV.opt.music<=0){MUS.nextT=Math.max(MUS.nextT,AU.currentTime);return}
    const tr=musTrack(),sd=60/tr.bpm/(tr.div||4);if(MUS.nextT<AU.currentTime-.25)MUS.nextT=AU.currentTime+.05;
    let g=0;while(MUS.nextT<AU.currentTime+.2&&g++<8){try{tr.fn(MUS.step++,sd,Math.max(0,MUS.nextT-AU.currentTime))}catch(e){}MUS.nextT+=sd}
  },50);
}

/* ═══════════════ MOTOR DE REGLAS (sin DOM: se puede probar por separado) ═══════════════
   shots[i]: 0 sin explorar · 1 agua · 2 impacto · 3 agua detectada por sonar                */
const Engine={
  newBoard(){return{grid:new Array(100).fill(-1),shots:new Array(100).fill(0),ping:new Array(100).fill(0),ships:FLEET.map(()=>null)}},
  cells(r,c,size,dir){
    const out=[];
    for(let j=0;j<size;j++){const rr=r+(dir==='v'?j:0),cc=c+(dir==='h'?j:0);if(rr<0||rr>=N||cc<0||cc>=N)return null;out.push(rr*N+cc)}
    return out;
  },
  canPlace(b,fi,r,c,dir){const cs=Engine.cells(r,c,FLEET[fi].size,dir);return !!cs&&cs.every(x=>b.grid[x]===-1||b.grid[x]===fi)},
  place(b,fi,r,c,dir){
    if(!Engine.canPlace(b,fi,r,c,dir))return false;
    Engine.remove(b,fi);const f=FLEET[fi],cs=Engine.cells(r,c,f.size,dir);
    cs.forEach(x=>b.grid[x]=fi);b.ships[fi]={fi,id:f.id,n:f.n,size:f.size,r,c,dir,cells:cs,hits:0,sunk:false};return true;
  },
  remove(b,fi){const s=b.ships[fi];if(!s)return;s.cells.forEach(x=>b.grid[x]=-1);b.ships[fi]=null},
  clear(b){for(let fi=0;fi<FLEET.length;fi++)Engine.remove(b,fi)},
  randomFleet(b){
    for(let attempt=0;attempt<200;attempt++){
      Engine.clear(b);let ok=true;
      for(let fi=0;fi<FLEET.length&&ok;fi++){
        let placed=false;
        for(let t=0;t<300&&!placed;t++){const dir=Math.random()<.5?'h':'v';placed=Engine.place(b,fi,rint(0,N-1),rint(0,N-1),dir)}
        ok=placed;
      }
      if(ok)return b;
    }
    return b;
  },
  allPlaced(b){return b.ships.every(Boolean)},
  canTarget(b,i){return i>=0&&i<100&&b.shots[i]===0},
  fire(b,i){
    if(b.shots[i]===1||b.shots[i]===2)return{i,result:'repeat'};
    const fi=b.grid[i];
    if(fi<0){b.shots[i]=1;return{i,result:'miss'}}
    b.shots[i]=2;const s=b.ships[fi];s.hits++;
    if(s.hits>=s.size){s.sunk=true;return{i,result:'sunk',ship:s}}
    return{i,result:'hit',ship:s};
  },
  /* Calafate: la casilla vuelve a estar intacta (y oculta para el rival) */
  repair(b,i){if(b.shots[i]!==2)return false;const s=b.ships[b.grid[i]];if(!s||s.sunk)return false;b.shots[i]=0;b.ping[i]=0;s.hits=Math.max(0,s.hits-1);return true},
  /* Un tablero «sombra» (rival en línea) solo conoce los buques ya hundidos */
  allSunk(b){if(b.shadow)return b.ships.filter(s=>s&&s.sunk).length===FLEET.length;return b.ships.some(Boolean)&&b.ships.every(s=>!s||s.sunk)},
  alive(b){if(b.shadow)return FLEET.length-b.ships.filter(s=>s&&s.sunk).length;return b.ships.filter(s=>s&&!s.sunk).length},
  /* Lo que el atacante sabe del tablero rival: solo información pública (la IA no hace trampa) */
  view(b){
    const k=new Array(100);
    for(let i=0;i<100;i++){const s=b.shots[i],sh=b.ships[b.grid[i]];k[i]=s===0?0:(s===2?(sh&&sh.sunk?3:2):1)}
    const rem=b.shadow?FLEET.filter((f,fi)=>!(b.ships[fi]&&b.ships[fi].sunk)).map(f=>f.size):b.ships.filter(s=>s&&!s.sunk).map(s=>s.size);
    return{k,rem,ping:b.ping};
  },
  /* Aplica a un tablero sombra el resultado que resolvió el navegador del rival */
  applyRemote(b,i,p){
    if(p.result==='miss'){b.shots[i]=1;return{i,result:'miss'}}
    b.shots[i]=2;const sh=p.ship;
    if(p.result==='sunk'&&sh&&Number.isInteger(sh.fi)&&sh.fi>=0&&sh.fi<FLEET.length){
      const f=FLEET[sh.fi],dir=sh.dir==='v'?'v':'h',cs=Engine.cells(sh.r|0,sh.c|0,f.size,dir)||[i];
      const s={fi:sh.fi,id:f.id,n:f.n,size:f.size,r:sh.r|0,c:sh.c|0,dir,cells:cs,hits:f.size,sunk:true};
      b.ships[s.fi]=s;cs.forEach(x=>{b.grid[x]=s.fi;if(b.shots[x]===0||b.shots[x]===3)b.shots[x]=2});return{i,result:'sunk',ship:s}}
    return{i,result:'hit',ship:null};
  },
  clone(b){return JSON.parse(JSON.stringify(b))},
};

/* ═══════════════ IA (tres niveles) ═══════════════
   Fácil: casi al azar · Normal: caza/remate + paridad · Difícil: mapa de densidad de probabilidad */
const AI={
  unknown(v){const o=[];for(let i=0;i<100;i++)if(v.k[i]===0)o.push(i);return o},
  /* Para cada barco que sigue a flote, cuenta cuántas posiciones válidas pasan por cada casilla.
     Las posiciones que explican impactos sin hundir pesan muchísimo más (modo remate). */
  density(v){
    const sc=new Float64Array(100),k=v.k;
    for(const size of v.rem){
      for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(let d=0;d<2;d++){
        if(d===0&&c+size>N)continue;if(d===1&&r+size>N)continue;
        let ok=true,h=0;
        for(let j=0;j<size;j++){const x=d?(r+j)*N+c:r*N+c+j,s=k[x];if(s===1||s===3){ok=false;break}if(s===2)h++}
        if(!ok)continue;
        const w=h?Math.pow(30,h):1;
        for(let j=0;j<size;j++){const x=d?(r+j)*N+c:r*N+c+j;if(k[x]===0)sc[x]+=w*(v.ping&&v.ping[x]?8:1)}
      }
    }
    return sc;
  },
  targets(v){
    const k=v.k,hits=[];for(let i=0;i<100;i++)if(k[i]===2)hits.push(i);
    if(!hits.length)return[];
    const line=new Set(),near=new Set(),at=(r,c)=>r<0||r>=N||c<0||c>=N?-9:k[r*N+c];
    for(const h of hits){
      const r=Math.floor(h/N),c=h%N;
      for(const[dr,dc]of[[0,1],[1,0]]){
        if(at(r+dr,c+dc)!==2&&at(r-dr,c-dc)!==2)continue;
        for(const s of[1,-1]){let rr=r,cc=c;while(at(rr,cc)===2){rr+=dr*s;cc+=dc*s}if(at(rr,cc)===0)line.add(rr*N+cc)}
      }
      for(const[dr,dc]of[[0,1],[1,0],[0,-1],[-1,0]])if(at(r+dr,c+dc)===0)near.add((r+dr)*N+c+dc);
    }
    return[...(line.size?line:near)];
  },
  parity(v,avail){
    const m=Math.max(2,Math.min(...(v.rem.length?v.rem:[2])));
    const p=avail.filter(i=>(Math.floor(i/N)+i%N)%m===0);
    return p.length?p:avail;
  },
  pick(level,v,n){
    n=n||1;const avail=AI.unknown(v);if(!avail.length)return[];
    const out=[],add=list=>{for(const i of shuffle(list.slice())){if(out.length>=n)break;if(!out.includes(i)&&v.k[i]===0)out.push(i)}};
    if(level==='hard'){
      const sc=AI.density(v);shuffle(avail).sort((a,b)=>sc[b]-sc[a]);
      for(const i of avail){if(out.length>=n)break;out.push(i)}
    }else if(level==='normal'){
      add(AI.targets(v));add(AI.parity(v,avail));add(avail);
    }else{
      if(Math.random()<.35)add(AI.targets(v));add(avail);
    }
    return out;
  },
};

/* Ajusta el tamaño de un texto para que quepa en una caja: mide el ancho y la altura real de los glifos
   (actualBoundingBox) y reduce el cuerpo hasta que entre. Devuelve {px,asc,desc,w}. */
function fitText(txt,maxW,maxH,fontFn,startPx,minPx){
  let px=startPx;minPx=minPx||8;
  for(let i=0;i<24;i++){D.font=fontFn(px);const m=D.measureText(txt),asc=m.actualBoundingBoxAscent||px*.72,desc=m.actualBoundingBoxDescent||px*.08,w=m.width+8;

    px=Math.max(minPx,px*Math.min(.96,Math.min(maxW/w,maxH/(asc+desc))))}
  D.font=fontFn(px);return{px,asc:px*.72,desc:px*.08,w:D.measureText(txt).width};
}
/* Escribe un texto centrado verticalmente según sus glifos reales dentro de [top, top+h] */
function fitTextBox(txt,x,top,maxW,h,col,fontFn,startPx,align,minPx){
  const f=fitText(txt,maxW,h,fontFn,startPx,minPx),y=top+(h-(f.asc+f.desc))/2+f.asc;sText(txt,x,y,col,fontFn(f.px),align||'left','alphabetic');return f;

const fx={p:[],t:[]};

function ftext(x,y,s,col,sz){fx.t.push({x,y,s,col,sz:sz||16,l:1.1,m:1.1,vy:-50});if(fx.t.length>40)fx.t.shift()}
function addP(L,o){L.push(o);if(L.length>900)L.splice(0,L.length-900)}
function pRing(L,x,y,r0,r1,col,l,w){addP(L,{k:'ring',x,y,vx:0,vy:0,g:0,r0,r1,col,l,m:l,w:w||3})}
function splashFx(L,x,y,s){

}
function smokeFx(L,x,y,s){addP(L,{k:'smoke',x:x+rnd(-s*.15,s*.15),y,vx:rnd(-6,6),vy:-s*rnd(.6,1.2),g:0,l:1.2,m:1.2,col:'#5a5470',sz:s*.18})}

      for(let k=0;k<2;k++){const pts=[{x:x+rnd(-s*.6,s*.6),y:y-s*3}];for(let j=1;j<6;j++)pts.push({x:lerp(pts[0].x,x,j/6)+rnd(-s*.3,s*.3),y:lerp(y-s*3,y,j/6)});pts.push({x,y});addP(L,{k:'bolt',pts,x,y,vx:0,vy:0,g:0,l:.28,m:.28,col:'#ffc93c'})}

    case'tinta':
      for(let i=0;i<14;i++){const a=rnd(0,TAU),v=s*rnd(.6,2.4);addP(L,{k:'ink',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:0,l:rnd(.8,1.3),m:1.3,col:Math.random()<.5?'#0d1424':'#2b3c52',sz:s*rnd(.14,.3)})}
      pRing(L,x,y,s*.1,s*1,'#7aa7ff',.5,4);break;
    case'estrellas':
      pRing(L,x,y,s*.1,s*1.1,'#ffc93c',.55,3);
      for(let i=0;i<14;i++){const a=rnd(0,TAU),v=s*rnd(1.5,4);addP(L,{k:'star',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:s*3,l:rnd(.6,1),m:1,col:pick(['#ffc93c','#e8492f','#fff','#f0a03a']),sz:s*rnd(.08,.16),rot:rnd(0,TAU)})}break;
    case'geiser':

      for(let i=0;i<10;i++){const a=rnd(0,TAU),v=s*rnd(1.5,4);addP(L,{k:'d',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:s*3,l:.4,m:.4,col:'#ffcf7a',sz:s*.05})}break;
    case'griego':
      pRing(L,x,y,s*.1,s*1.1,'#7dff8a',.5,4);
      for(let i=0;i<26;i++)addP(L,{k:'flame',x:x+rnd(-s*.35,s*.35),y:y+rnd(-s*.1,s*.25),vx:rnd(-s*.3,s*.3),vy:-s*rnd(.8,2.2),g:0,l:rnd(.6,1.2),m:1.2,col:pick(['#7dff8a','#c6ff5c','#2fd36b','#eaff9a']),sz:s*rnd(.08,.16)});break;
    default:

function tickP(L,dt){
  for(let i=L.length-1;i>=0;i--){const p=L[i];p.l-=dt;if(p.l<=0){L.splice(i,1);continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;if(p.k==='d'||p.k==='sq'||p.k==='star'){p.vx*=.98;p.vy*=.98}if(p.k==='ink'){p.vx*=.93;p.vy*=.93}if(p.k==='bub')p.vx*=.95;if(p.rot!=null)p.rot+=dt*4}
}
function drawP(L){
  for(const p of L){const a=clamp(p.l/p.m,0,1);
    switch(p.k){
      case'ring':{const r=lerp(p.r0,p.r1,1-a*a);D.globalCompositeOperation='lighter';D.globalAlpha=a;D.strokeStyle=p.col;D.lineWidth=p.w*(.4+a);D.beginPath();D.arc(p.x,p.y,r,0,TAU);D.stroke();D.globalCompositeOperation='source-over';break}
      case'd':D.globalCompositeOperation='lighter';D.globalAlpha=a;D.fillStyle=p.col;D.beginPath();D.arc(p.x,p.y,Math.max(.5,p.sz*(.4+.6*a)),0,TAU);D.fill();D.globalCompositeOperation='source-over';break;
      case'sq':D.globalCompositeOperation='lighter';D.globalAlpha=a;D.fillStyle=p.col;D.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);D.globalCompositeOperation='source-over';break;
      case'smoke':D.globalAlpha=a*.35;D.fillStyle=p.col;D.beginPath();D.arc(p.x,p.y,p.sz*(2.2-a),0,TAU);D.fill();break;
      case'bub':D.globalAlpha=a*.85;D.strokeStyle=p.col;D.lineWidth=1.4;D.beginPath();D.arc(p.x,p.y,p.sz,0,TAU);D.stroke();break;
      case'ink':D.globalAlpha=a*.6;D.fillStyle=p.col;D.beginPath();D.arc(p.x,p.y,p.sz*(1.6-a*.6),0,TAU);D.fill();break;
      case'star':{D.globalCompositeOperation='lighter';D.globalAlpha=a;D.fillStyle=p.col;D.save();D.translate(p.x,p.y);D.rotate(p.rot);D.beginPath();for(let i=0;i<10;i++){const an=-Math.PI/2+i*Math.PI/5,rr=i%2?p.sz*.45:p.sz;D.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}D.closePath();D.fill();D.restore();D.globalCompositeOperation='source-over';break}
      case'flame':D.globalCompositeOperation='lighter';D.globalAlpha=a*.85;D.fillStyle=p.col;D.beginPath();D.ellipse(p.x,p.y,p.sz*(.5+.5*a),p.sz*(1+.6*(1-a)),0,0,TAU);D.fill();D.globalCompositeOperation='source-over';break;

      case'bolt':D.globalCompositeOperation='lighter';D.globalAlpha=a;D.lineCap='round';D.strokeStyle=p.col;D.lineWidth=5*a;D.beginPath();p.pts.forEach((q,i)=>D[i?'lineTo':'moveTo'](q.x,q.y));D.stroke();D.strokeStyle='#fff';D.lineWidth=1.6;D.stroke();D.globalCompositeOperation='source-over';break;

}
function tickFx(dt){

/* ═══════════════ BARCOS (vista cenital, vectoriales y con detalle según el tamaño de casilla) ═══════════════ */
const SHIPW={portaaviones:.72,acorazado:.62,crucero:.56,submarino:.46,destructor:.5};
function hullPath(fid,x0,x1,y0,w,mid,cell,rig){
  D.beginPath();const l=x1-x0;
  if(rig==='nautilus'){D.moveTo(x1+cell*.16,mid);D.lineTo(x1-l*.05,mid-w*.16);D.bezierCurveTo(x1-l*.2,y0-w*.02,x0+l*.25,y0,x0+l*.05,mid-w*.24);D.quadraticCurveTo(x0-cell*.03,mid,x0+l*.05,mid+w*.24);D.bezierCurveTo(x0+l*.25,y0+w,x1-l*.2,y0+w*1.02,x1-l*.05,mid+w*.16);D.closePath();return}
  if(fid==='submarino'&&rig==='modern'){D.moveTo(x1,mid);D.bezierCurveTo(x1-w*.35,y0,x1-w*1.1,y0,x1-w*1.6,y0);D.lineTo(x0+w*.7,y0);D.quadraticCurveTo(x0,y0,x0,mid);D.quadraticCurveTo(x0,y0+w,x0+w*.7,y0+w);D.lineTo(x1-w*1.6,y0+w);D.bezierCurveTo(x1-w*1.1,y0+w,x1-w*.35,y0+w,x1,mid);D.closePath();return}
  if(rig==='sail'||rig==='oars'){const bow=Math.min(w*1.5,l*.34);D.moveTo(x0,y0+w*.14);D.lineTo(x1-bow,y0);D.bezierCurveTo(x1-bow*.3,y0,x1,mid-w*.22,x1,mid);D.bezierCurveTo(x1,mid+w*.22,x1-bow*.3,y0+w,x1-bow,y0+w);D.lineTo(x0,y0+w*.86);D.quadraticCurveTo(x0-w*.08,mid,x0,y0+w*.14);D.closePath();return}
  const bow=Math.min(w*1.4,cell*.95);
  D.moveTo(x0+w*.15,y0);D.lineTo(x1-bow,y0);D.quadraticCurveTo(x1-bow*.2,y0+w*.06,x1,mid);D.quadraticCurveTo(x1-bow*.2,y0+w*.94,x1-bow,y0+w);
  D.lineTo(x0+w*.15,y0+w);D.quadraticCurveTo(x0,y0+w,x0,y0+w*.8);D.lineTo(x0,y0+w*.2);D.quadraticCurveTo(x0,y0,x0+w*.15,y0);D.closePath();
}
/* Convierte un punto local del barco a coordenadas de pantalla (para soltar humo) */
function toWorld(x,y){const m=D.getTransform();return{x:(m.a*x+m.c*y+m.e)/DPR,y:(m.b*x+m.d*y+m.f)/DPR}}
function lifeboats(x0,x1,yy,h,col,n){D.fillStyle=col;const sp=(x1-x0)/n;for(let i=0;i<n;i++){rrect(x0+i*sp+sp*.12,yy,sp*.76,h,h/2);D.fill()}}
function turret(tx,ty,r,dir,col,edge,twin){
  D.fillStyle=col;D.beginPath();D.moveTo(tx-r*dir*.9,ty-r);D.lineTo(tx+r*dir*.55,ty-r);D.quadraticCurveTo(tx+r*dir*1.1,ty,tx+r*dir*.55,ty+r);D.lineTo(tx-r*dir*.9,ty+r);D.closePath();D.fill();

function funnel(fx_,fy,rw,rh,col,top,o){
  D.fillStyle=col;D.beginPath();D.ellipse(fx_,fy,rw,rh,0,0,TAU);D.fill();D.fillStyle=top||'#14181a';D.beginPath();D.ellipse(fx_,fy,rw*.62,rh*.6,0,0,TAU);D.fill();

}
function sails(mx,mid,w,cell,skin,o,k){
  const ghost=skin.pat==='ghost',sc=skin.sail||'#f1ece0',span=w*1.38,belly=cell*(.16+.04*Math.sin((o.t||0)*1.3+k));

    D.fillStyle=ghost?rgba(sc,.55):sc;D.beginPath();D.moveTo(xx,yA);D.quadraticCurveTo(xx+belly*(1.25-j*.3),mid,xx,yB);D.lineTo(xx-cell*.05,yB);D.quadraticCurveTo(xx+belly*(.7-j*.2),mid,xx-cell*.05,yA);D.closePath();D.fill();
    D.strokeStyle='rgba(0,0,0,.28)';D.lineWidth=.8;D.stroke();
    if(ghost){D.fillStyle='rgba(7,24,32,.85)';for(let h=0;h<3;h++){D.beginPath();D.arc(xx+belly*.4,yA+sp*(.2+.3*h),cell*.03+h*.6,0,TAU);D.fill()}}

function drawShip(px,py,cell,size,dir,fid,skin,o){
  o=o||{};D.save();D.translate(px,py);if(dir==='v'){D.translate(cell,0);D.rotate(Math.PI/2)}
  const t=o.t||0,rig=skin.rig||'modern',pat=skin.pat,lod=cell>=34?2:cell>=20?1:0,sunk=!!o.sunk;
  let al=o.alpha!=null?o.alpha:1;if(pat==='ghost'&&!sunk)al*=.72+.16*Math.sin(t*2.3);D.globalAlpha=al;
  const L=size*cell,w=cell*(rig==='nautilus'?.5:rig==='sail'||rig==='oars'?.56:(SHIPW[fid]||.6)),mid=cell/2,y0=mid-w/2,x0=cell*.1,x1=L-cell*.08;
  const HP=()=>hullPath(fid,x0,x1,y0,w,mid,cell,rig),edgeW=Math.max(1,cell*.035);
  /* espuma en la línea de flotación y ola de proa */
  if(!sunk&&o.water!==false&&lod){
    D.save();D.globalAlpha=al*.5;HP();D.strokeStyle='rgba(233,239,233,.5)';D.lineWidth=cell*(.08+.03*Math.sin(t*2));D.stroke();
    for(let k=0;k<2;k++){const q=mod(t*.5+k*.5,1);D.globalAlpha=al*.55*(1-q);D.strokeStyle='#f4f6f2';D.lineWidth=1.2;D.beginPath();D.arc(x1-cell*.1,mid,w*(.55+q*.7),-.9,.9);D.stroke()}
    D.globalAlpha=al*.45;D.fillStyle='#f4f6f2';for(let k=0;k<5;k++){const q=mod(t*.7+k*.2,1);D.beginPath();D.arc(x0-q*cell*.32,mid+Math.sin(k*2.1+t)*w*.22,(1-q)*cell*.035+.5,0,TAU);D.fill()}
    D.restore();D.globalAlpha=al;
  }
  /* sombra y casco */
  D.save();D.translate(cell*.05,cell*.07);HP();D.fillStyle='rgba(0,0,0,.35)';D.fill();D.restore();

      else{const fl=.8+.2*Math.sin(t*12+i*1.7),fg=D.createRadialGradient(cx,cy,0,cx,cy,c*.55*fl);fg.addColorStop(0,'rgba(255,170,70,.75)');fg.addColorStop(.5,'rgba(232,73,47,.35)');fg.addColorStop(1,'rgba(232,73,47,0)');D.fillStyle=fg;D.fillRect(x-c*.2,y-c*.2,c*1.4,c*1.4);
        if(o.smoke&&Math.random()<.025)smokeFx(fx.p,cx,cy-c*.2,c)}
      const k=c*(hc?.28:.22);D.lineCap='square';
      if(hc||ink){D.strokeStyle='rgba(7,24,32,.9)';D.lineWidth=Math.max(4,c*.18);D.beginPath();D.moveTo(cx-k,cy-k);D.lineTo(cx+k,cy+k);D.moveTo(cx+k,cy-k);D.lineTo(cx-k,cy+k);D.stroke()}
      D.strokeStyle=sunk?COL.bone:hc?'#ff5a3c':COL.flag;D.lineWidth=Math.max(2,c*(hc?.13:.1));D.beginPath();D.moveTo(cx-k,cy-k);D.lineTo(cx+k,cy+k);D.moveTo(cx+k,cy-k);D.lineTo(cx-k,cy+k);D.stroke();
    }
    else if(o.pings&&b.ping[i]){const p=.5+.5*Math.sin(t*5+i);D.strokeStyle='rgba(95,211,168,'+(.55+.4*p)+')';D.lineWidth=2;D.beginPath();D.moveTo(cx,cy-c*.3);D.lineTo(cx+c*.3,cy);D.lineTo(cx,cy+c*.3);D.lineTo(cx-c*.3,cy);D.closePath();D.stroke();D.fillStyle='rgba(95,211,168,'+(.12+.18*p)+')';D.fill()}
  }
}
function drawStatus(R,b,own,skinCol){
  const c=R.cell,m=c*.36,y=R.gy+c*10+c*.34;let x=R.gx;
  for(const f of FLEET){
    const s=b.ships[FLEET.indexOf(f)],w=f.size*m,h=m*.55;
    for(let j=0;j<f.size;j++){
      let col='rgba(233,239,233,.14)';
      if(s&&s.sunk)col=COL.flag;else if(own&&s)col=b.shots[s.cells[j]]===2?'#f0a03a':skinCol;
      D.fillStyle=col;D.fillRect(x+j*m+.5,y,m-1.5,h);
    }
    if(s&&s.sunk){D.strokeStyle=COL.bone;D.lineWidth=1.4;D.beginPath();D.moveTo(x,y+h/2);D.lineTo(x+w,y+h/2);D.stroke()}
    x+=w+m*.6;
  }
}
function drawHeat(R,b,dens){
  let mx=0;for(let i=0;i<100;i++)if(b.shots[i]===0&&dens[i]>mx)mx=dens[i];if(!mx)return;
  const c=R.cell;
  for(let i=0;i<100;i++){if(b.shots[i]!==0)continue;const v=dens[i]/mx;if(v<.02)continue;const p=cellXY(R,i);
    D.fillStyle='rgba('+Math.round(lerp(255,232,v))+','+Math.round(lerp(201,73,v))+','+Math.round(lerp(60,47,v))+','+(.07+.5*v*v)+')';D.fillRect(p.x+1,p.y+1,c-2,c-2);
    if(c>26&&v>.55){D.fillStyle='rgba(255,255,255,.85)';D.font=fMono(600,c*.24);D.textAlign='center';D.textBaseline='middle';D.fillText(Math.round(v*100)+'',p.x+c/2,p.y+c/2)}}
}
function drawCrosshair(x,y,s,col,t){
  D.save();D.translate(x,y);D.strokeStyle=col;D.lineWidth=2;D.lineCap='square';const h=s*.42*(1+.05*Math.sin(t*8)),l=s*.16;
  for(const[sx,sy]of[[-1,-1],[1,-1],[1,1],[-1,1]]){D.beginPath();D.moveTo(sx*h,sy*(h-l));D.lineTo(sx*h,sy*h);D.lineTo(sx*(h-l),sy*h);D.stroke()}
  D.fillStyle=col;D.fillRect(-1.5,-1.5,3,3);
  D.globalAlpha=.5;D.beginPath();D.moveTo(-s*.7,0);D.lineTo(-h-2,0);D.moveTo(h+2,0);D.lineTo(s*.7,0);D.moveTo(0,-s*.7);D.lineTo(0,-h-2);D.moveTo(0,h+2);D.lineTo(0,s*.7);D.stroke();
  D.restore();
}

/* ═══════════════ PARTIDA: estado, turnos, modos y poderes ═══════════════
   Cada jugador es un «controlador»: humano (clic/teclado) o IA. El flujo de turnos no distingue
   entre ellos más allá de quién elige la casilla; así un jugador remoto podría añadirse después. */
let scene='menu',game=null,paused=false;
const waits=[],anims=[];
const spd=()=>SV.opt.fast?.55:1;
function wait(ms){return new Promise(res=>waits.push({t:ms/1000*spd(),res}))}
function tickWaits(dt){for(let i=waits.length-1;i>=0;i--){const w=waits[i];w.t-=dt;if(w.t<=0){waits.splice(i,1);w.res()}}}
const curP=()=>game.players[game.turn],oppP=()=>game.players[1-game.turn];
const isHumanTurn=()=>game&&game.phase==='battle'&&!game.over&&!curP().isAI;
function canHumanAct(){return !!game&&scene==='game'&&!paused&&game.phase==='battle'&&!game.busy&&!game.over&&!curP().isAI}

function mkPlayer(idx,o){
  const a=o.adm?admById(o.adm):null;
  const p={idx,name:o.name,adm:a,isAI:!!o.isAI,ai:o.ai||null,board:Engine.newBoard(),charge:0,decoy:false,score:0,
    skin:fleetById(o.fleet),ensign:o.ensign||'ancla',efx:o.efx||'explosion',bonus:null,final:0,
    st:{shots:0,hits:0,sunk:0,streak:0,maxStreak:0,powers:0,turnSinks:0,maxTurnSinks:0,lost:0,timeouts:0,repairs:0,beacons:0}};
  if(a)p.charge=Math.min(100,(a.id==='kraken'?50:0)+10*upLv('start'));
  return p;
}
function newGame(mode,diff){
  const m=MODES[mode],df=DIFFS[diff],np=m.np||1;
  const g={id:Math.random(),mode,diff,np,
    rules:{salvo:!!m.salvo,timer:m.timer?df.timer+upLv('time'):0,challenge:!!m.challenge,limit:m.challenge?df.limit+3*upLv('watch'):0,repeat:!m.salvo&&!m.challenge&&SV.opt.repeat},
    players:[],turn:0,phase:'place',placing:0,busy:false,shotsLeft:1,sel:[],hist:[],time:0,turnT:0,log:[],over:false,winner:-1,
    aiming:null,hover:null,cursor:44,kbd:false,dir:'h',pickFi:0,aiThink:null,reveal:false,initBoards:null,res:null,passRes:null};
  g.players.push(mkPlayer(0,{name:SV.name||'PILOTO',adm:SV.adm,fleet:SV.fleet,ensign:SV.ensign,efx:SV.efx}));
  if(np>1)g.players.push(mkPlayer(1,{name:SV.name2||'PILOTO 2',adm:SV.adm2,fleet:SV.fleet==='oxido'?'gris':'oxido',ensign:SV.ensign==='rosa'?'ola':'rosa',efx:SV.efx}));
  else g.players.push(mkPlayer(1,{name:df.foe,isAI:true,ai:df.ai,fleet:'tinta',ensign:'calavera',efx:'explosion'}));
  if(np===1)Engine.randomFleet(g.players[1].board);
  game=g;scene='game';paused=false;waits.length=0;anims.length=0;fx.p.length=0;fx.t.length=0;banner=null;
  $('stage').classList.add('ingame');
  if(m.challenge){g.phase='battle';startBattle()}
  else{g.phase='place';g.placing=0;musMood(1);showBanner('Coloca tu flota',np>1?g.players[0].name:'Elige un buque y una casilla','#ffc93c',1.3)}
  renderBar();
}
function log(msg){const g=game;if(!g)return;g.log.unshift(msg);g.log.length=Math.min(g.log.length,3);updateLog()}
function updateMood(){const g=game;if(!g||g.rules.challenge){musMood(1);return}musMood(g.players.some(p=>Engine.alive(p.board)<=2)?2:1)}

/* ───── Colocación ───── */
function nextUnplaced(b){for(let fi=0;fi<FLEET.length;fi++)if(!b.ships[fi])return fi;return-1}
function placeBoard(){return game.players[game.placing].board}
function placeAt(i){
  const g=game;if(!g||g.phase!=='place'||paused||i<0)return;const b=placeBoard(),occ=b.grid[i];
  if(g.pickFi<0){if(occ>=0)pickUpShip(occ);return}
  const r=Math.floor(i/N),c=i%N;
  if(Engine.place(b,g.pickFi,r,c,g.dir)){
    sfx('place');const R=rectFor(g.placing);if(R){const p=cellCenter(R,i);splashFx(fx.p,p.x,p.y,R.cell*.8)}
    g.pickFi=nextUnplaced(b);renderBar();
  }else if(occ>=0&&occ!==g.pickFi){pickUpShip(occ)}
  else{sfx('error');toastMsg('No cabe ahí: se sale del tablero o choca con otro barco','#e8492f')}
}
function pickUpShip(fi){const g=game,b=placeBoard(),s=b.ships[fi];if(!s)return;g.dir=s.dir;Engine.remove(b,fi);g.pickFi=fi;sfx('rotate');renderBar()}
function selectShip(fi){const g=game;if(!g||g.phase!=='place')return;const b=placeBoard();if(b.ships[fi])pickUpShip(fi);else{g.pickFi=fi;sfx('click');renderBar()}}
function rotateShip(){const g=game;if(!g||g.phase!=='place')return;g.dir=g.dir==='h'?'v':'h';sfx('rotate');renderBar()}
function randomPlace(){const g=game;if(!g||g.phase!=='place')return;Engine.randomFleet(placeBoard());g.pickFi=-1;sfx('place');renderBar()}
function clearPlace(){const g=game;if(!g||g.phase!=='place')return;Engine.clear(placeBoard());g.pickFi=0;sfx('back');renderBar()}
async function placeReady(){
  const g=game;if(!g||g.phase!=='place')return;
  if(!Engine.allPlaced(placeBoard())){sfx('error');toastMsg('Coloca los 5 barcos antes de continuar','#e8492f');return}
  sfx('ready');
  if(g.online){onlineReady();return}
  if(g.np>1&&g.placing===0){g.placing=1;g.pickFi=0;g.dir='h';await showPass(1,'place');if(game!==g)return;showBanner('Coloca tu flota',g.players[1].name,'#ffc93c',1.6);renderBar();return}
  startBattle();
}
async function startBattle(){
  const g=game;g.phase='battle';g.busy=true;g.initBoards=g.players.map(p=>Engine.clone(p.board));
  for(const p of g.players){if(p.isAI||!Engine.allPlaced(p.board))continue;p.board.ships.forEach(s=>s.cells.forEach(x=>SV.place[x]++));SV.placeGames++}
  saveSV();musMood(1);g.turn=g.online?g.firstTurn:0;
  if(g.np>1){await showPass(0,'battle');if(game!==g)return}
  if(g.rules.challenge)showBanner('Desafío','Hunde la flota en '+g.rules.limit+' disparos','#ffc93c',2.2);
  else showBanner('¡Zafarrancho de combate!','Todos a sus puestos','#ffc93c',1.6);
  log(g.rules.challenge?'La flota enemiga está oculta. Tienes '+g.rules.limit+' disparos.':'Batalla iniciada. Dispara a la flota enemiga.');
  await wait(g.rules.challenge?600:900);if(game!==g)return;
  beginTurn();
}
/* Pantalla de relevo (Duelo): oculta los tableros hasta que el siguiente jugador confirma */
function showPass(pi,ctx){
  const g=game;g.prevPhase=g.phase;g.phase='pass';g.busy=true;renderBar();
  return new Promise(res=>{g.passRes=()=>{g.phase=g.prevPhase;g.busy=false;g.passRes=null;hideOV();res()};showPassScreen(pi,ctx)});
}

/* ───── Turnos ───── */
function beginTurn(){
  const g=game,p=curP();if(g.over)return;
  g.shotsLeft=g.rules.salvo?Math.max(1,Engine.alive(p.board)):1;
  g.sel=[];p.st.turnSinks=0;g.turnT=g.rules.timer;g.aiming=null;g.busy=false;g.tickN=-1;
  if(p.adm&&p.adm.id==='estela')addCharge(p,6);
  updateMood();renderBar();
  if(p.isRemote){g.busy=true;showBanner('Turno de '+p.name,'Espera su disparo','#e9efe9',1);renderBar();return}
  if(p.isAI){aiTurn();return}
  if(!g.rules.challenge){showBanner(g.np>1?'Turno de '+p.name:'Tu turno',g.rules.salvo?'Tienes '+g.shotsLeft+' disparos':g.rules.timer?g.rules.timer+' segundos por turno':'','#e9efe9',1);sfx('turn')}
}
async function endTurn(){
  const g=game;if(!g||g.over)return;g.busy=true;g.aiming=null;
  if(g.online&&!curP().isRemote)netSend({t:'turn'});
  g.turn=1-g.turn;
  if(g.np>1){await showPass(g.turn,'battle');if(game!==g)return}
  beginTurn();
}
function checkEnd(){
  const g=game;if(!g||g.over)return true;
  if(Engine.allSunk(g.players[1].board)){endGame(0,'fleet');return true}
  if(Engine.allSunk(g.players[0].board)){endGame(1,'fleet');return true}
  return false;
}
async function afterAttack(results){
  const g=game;if(!g||g.over)return;if(checkEnd())return;
  const att=curP();
  if(g.rules.challenge){att.st.turnSinks=0;if(att.st.shots>=g.rules.limit){endGame(1,'limit');return}g.busy=false;renderBar();return}
  const anyHit=results.some(r=>r&&(r.result==='hit'||r.result==='sunk'));
  if(anyHit&&g.rules.repeat){
    g.busy=false;g.turnT=g.rules.timer;g.tickN=-1;renderBar();
    if(att.isAI)aiTurn();else ftextCenter('¡Dispara otra vez!','#5fd3a8');
    return;
  }
  await wait(520);if(game!==g)return;endTurn();
}
function ftextCenter(s,col){const R=rectFor(1-game.turn);if(R)ftext(R.gx+R.cell*5,R.gy-R.cell*1.1,s,col,15)}
function timeout(){
  const g=game,p=curP();p.st.timeouts++;g.busy=true;g.sel=[];g.aiming=null;
  sfx('error');showBanner('¡Tiempo!','Pierdes el turno','#e8492f',1.2);log(p.name+' se quedó sin tiempo');
  wait(800).then(()=>{if(game===g&&!g.over)endTurn()});
}

/* ───── Disparos ───── */
function rectFor(pi){return RECTS.find(r=>r.pi===pi)||null}
function originFor(att,toPi){const R=rectFor(att.idx);if(R&&R.pi!==toPi)return{x:R.gx+R.cell*5,y:R.gy+R.cell*5};return{x:W/2,y:H+20}}
function projectile(x0,y0,x1,y1,col,dur,kind){return new Promise(res=>anims.push({x0,y0,x1,y1,col,t:0,dur:dur*spd(),res,kind:kind||'shell'}))}
function addCharge(p,v){if(!p.adm)return;const b=p.charge;p.charge=Math.min(100,p.charge+v);if(b<100&&p.charge>=100&&!p.isAI){sfx('ready');toastMsg('¡Poder listo: '+p.adm.pn+'!',p.adm.col)}}
async function shoot(att,def,i,o){
  o=o||{};const g=game,R=rectFor(def.idx),to=R?cellCenter(R,i):{x:W/2,y:H/2},c=R?R.cell:30;
  const rq=def.isRemote&&!o.pre?netReq('fire',{i,o:{fast:!!o.fast,noProj:!!o.noProj}}):null;
  if(!o.noProj){const fr=originFor(att,def.idx);sfx('fire');await projectile(fr.x,fr.y,to.x,to.y,att.isAI?'#e8492f':'#ffc93c',o.fast?.24:.5);if(game!==g)return{i,result:'abort'}}
  let pre=o.pre||null;if(rq){pre=await rq;if(game!==g)return{i,result:'abort'}}
  if(pre&&!['miss','hit','sunk','decoy'].includes(pre.result)){renderBar();return{i,result:'repeat'}}
  if((pre&&pre.result==='decoy')||(!pre&&def.decoy&&def.board.grid[i]>=0&&def.board.shots[i]===0)){
    def.decoy=false;att.st.shots++;att.st.streak=0;g.hist.push({a:att.idx,i,decoy:1});
    sfx('decoy');impactFx(fx.p,to.x,to.y,c,'estrellas');ftext(to.x,to.y-c*.4,'¡SEÑUELO!','#e9efe9',17);
    log('¡Señuelo! El disparo de '+att.name+' en '+coord(i)+' fue desviado');renderBar();return{i,result:'decoy'};
  }
  const r=pre?Engine.applyRemote(def.board,i,pre):Engine.fire(def.board,i);g.hist.push({a:att.idx,i});
  if(!o.free)att.st.shots++;
  const pm=DIFFS[g.diff].pts;
  if(r.result==='miss'){
    splashFx(fx.p,to.x,to.y,c);sfx('splash');att.st.streak=0;
    if(att.adm&&att.adm.id==='espectro')addCharge(att,8);
    ftext(to.x,to.y-c*.45,'AGUA','#e9efe9',14);log(att.name+' → '+coord(i)+': agua');
  }else if(r.result==='hit'||r.result==='sunk'){
    impactFx(fx.p,to.x,to.y,c,att.efx);sfx('hit');addShake(4);
    att.st.hits++;att.st.streak++;att.st.maxStreak=Math.max(att.st.maxStreak,att.st.streak);
    const mult=1+Math.min(att.st.streak-1,8)*(att.adm&&att.adm.id==='hondo'?.5:.25),pts=Math.round(100*mult*pm);att.score+=pts;
    ftext(to.x,to.y-c*.5,(r.result==='sunk'?'':'¡TOCADO! ')+'+'+pts,'#ffc93c',15);
    addCharge(att,25+4*upLv('power'));if(!def.isAI&&upLv('spare'))addCharge(def,5*upLv('spare'));
    if(r.result==='sunk'){
      const s=r.ship;att.st.sunk++;def.st.lost++;att.st.turnSinks++;att.st.maxTurnSinks=Math.max(att.st.maxTurnSinks,att.st.turnSinks);
      const bonus=Math.round((200+60*s.size)*pm*(att.adm&&att.adm.id==='brasa'?1.25:1)*(att.isAI?1:1+.1*upLv('bounty')));
      if(def.adm&&def.adm.id==='calafate')addCharge(def,30);att.score+=bonus;
      addCharge(att,10+(att.adm&&att.adm.id==='coral'?25:0));
      if(R)s.cells.forEach((x,k)=>{const p=cellCenter(R,x);impactFx(fx.p,p.x,p.y,c*(.8+k*.05),att.efx);smokeFx(fx.p,p.x,p.y,c)});
      sfx('sunk');addShake(11);addFlash(.25,'#ff8a3d');
      const sub=g.np>1?att.name+' hundió el '+s.n.toLowerCase():(att.isAI?'Te hundieron el '+s.n.toLowerCase():'Hundiste el '+s.n.toLowerCase()+' · +'+bonus);
      showBanner('¡Hundido!',sub,att.isAI&&g.np===1?'#e8492f':'#5fd3a8',1.7);
      log(att.name+' → '+coord(i)+': ¡hundió el '+s.n.toLowerCase()+'!');updateMood();
    }else log(att.name+' → '+coord(i)+': ¡tocado!');
  }
  renderBar();return r;
}
async function humanFire(i){
  const g=game;if(!canHumanAct()||i<0)return;
  if(g.aiming){runPower(g.aiming,i);return}
  const att=curP(),def=oppP();
  if(!Engine.canTarget(def.board,i)){sfx('error');toastMsg('Ya conoces la casilla '+coord(i),'#f0a03a');return}
  if(g.rules.salvo){
    const k=g.sel.indexOf(i);
    if(k>=0)g.sel.splice(k,1);else if(g.sel.length<g.shotsLeft)g.sel.push(i);else{sfx('error');toastMsg('Ya elegiste '+g.shotsLeft+' casillas. Dispara la salva o quita alguna.','#f0a03a');return}
    sfx('click');renderBar();return;
  }
  g.busy=true;renderBar();
  const r=await shoot(att,def,i);if(game!==g)return;
  afterAttack([r]);
}
async function fireSalvo(){
  const g=game;if(!canHumanAct()||!g.rules.salvo)return;
  const avail=oppP().board.shots.filter(s=>s===0).length,need=Math.min(g.shotsLeft,avail);
  if(g.sel.length<need){sfx('error');toastMsg('Elige '+(need-g.sel.length)+' casilla'+(need-g.sel.length>1?'s':'')+' más para la salva','#f0a03a');return}
  g.busy=true;const list=g.sel.slice();g.sel=[];renderBar();const res=[];
  for(const i of list){res.push(await shoot(curP(),oppP(),i,{fast:true}));if(game!==g)return;if(checkEnd())return}
  g.shotsLeft=0;const h=res.filter(r=>r.result==='hit'||r.result==='sunk').length;
  log('Salva de '+curP().name+': '+h+' impacto'+(h===1?'':'s')+' de '+list.length);
  await wait(650);if(game!==g)return;endTurn();
}
/* ───── IA ───── */
async function aiTurn(){
  const g=game,p=curP(),def=oppP();g.busy=true;renderBar();
  await wait(420);if(game!==g||g.over)return;
  const view=Engine.view(def.board),picks=AI.pick(p.ai,view,g.shotsLeft),dens=SV.opt.visor?AI.density(view):null,res=[];
  let from=rint(0,99);
  for(const i of picks){
    g.aiThink={dens,from,to:i,t:0,dur:.75*spd()};sfx('aim');
    await wait(820);if(game!==g)return;
    res.push(await shoot(p,def,i,{fast:g.rules.salvo}));if(game!==g)return;
    from=i;if(checkEnd()){g.aiThink=null;return}
  }
  g.aiThink=null;
  if(g.rules.salvo){const h=res.filter(r=>r.result==='hit'||r.result==='sunk').length;log('Salva enemiga: '+h+' impacto'+(h===1?'':'s')+' de '+res.length);g.shotsLeft=0;await wait(600);if(game!==g)return;endTurn();return}
  afterAttack(res);
}

/* ───── Poderes de almirante ───── */
function onPowerBtn(){
  const g=game;if(!canHumanAct())return;const p=curP();if(!p.adm)return;
  if(g.aiming){g.aiming=null;renderBar();sfx('back');return}
  if(p.charge<100){sfx('error');toastMsg('Poder al '+Math.floor(p.charge)+'%: acierta para cargarlo','#f0a03a');return}
  const k=p.adm.power;
  if(k==='senuelo'&&p.decoy){toastMsg('Ya tienes un señuelo activo','#e9efe9');return}

function powerCells(k,i){

function finalize(g){
  const st=SV.st,df=DIFFS[g.diff],humans=g.np>1?[0,1]:[0];
  for(const pi of humans){
    const p=g.players[pi],win=g.winner===pi,acc=p.st.shots?p.st.hits/p.st.shots:0,pm=g.np>1?1:df.pts;
    p.acc=Math.round(acc*100);

    st.shots+=p.st.shots;st.hits+=p.st.hits;st.sunk+=p.st.sunk;st.powers+=p.st.powers;st.repairs+=p.st.repairs||0;st.beacons+=p.st.beacons||0;st.maxStreak=Math.max(st.maxStreak,p.st.maxStreak);

  const main=g.players[g.np>1?Math.max(0,g.winner):0],win=g.np>1||g.winner===0,me=g.players[0];
  if(g.online){st.lost+=me.st.lost;st.online=(st.online||0)+1;if(g.winner===0){st.wins++;st.onlineWins=(st.onlineWins||0)+1;st.bestAcc=Math.max(st.bestAcc,me.acc)}}
  else if(g.np===1){
    st.lost+=me.st.lost;
    if(g.winner===0){
      st.wins++;st[{easy:'winsEasy',normal:'winsNormal',hard:'winsHard'}[g.diff]]++;
      if(!g.rules.challenge){if(me.st.lost===0)st.flawless++;if(Engine.alive(me.board)===1)st.lastShip++}
      st.bestAcc=Math.max(st.bestAcc,me.acc);

let RECTS=[];const HUD={top:80,bot:96};
function computeRects(){
  const g=game;if(!g)return[];
  const narrow=W<760;HUD.top=Math.round((narrow?112:86)*U);
  const bar=$('bar');HUD.bot=bar&&bar.offsetHeight?bar.offsetHeight:90;
  const pad=12,gap=Math.max(18,34*U),avail=Math.max(120,H-HUD.top-HUD.bot-10),y0=HUD.top+4;

  const one=(pi,role,maxC)=>{const c=Math.min((W-pad*2)/BW,avail/BH,maxC||64);const w=c*BW,h=c*BH;return[mkRect((W-w)/2,y0+(avail-h)/2,c,pi,role)]};

  if(g.rules.challenge)return one(1,'target',62);

    return[mkRect(x0,y,c,viewer,'own'),mkRect(x0+w+gap,y,c,tgt,'target')];
  }

function drawHUD(t){
  const g=game;if(!g||g.phase==='pass')return;

  else if(g.phase==='wait'){mainT='Flota lista';sub='ESPERANDO A '+g.players[1].name.toUpperCase()+'.'.repeat(1+Math.floor(t*2)%3);col=COL.kelp}
  else if(g.phase==='replay'){mainT='Repetición';sub='DISPARO '+g.repIdx+' / '+g.hist.length;col=COL.signal}
  else if(g.over){mainT='Fin de la partida';sub=g.np>1?'GANA '+g.players[g.winner].name:(g.winner===0?'VICTORIA':'DERROTA');col=g.winner===0||g.np>1?COL.kelp:COL.flag}
  else{

    if(p.isRemote){mainT=p.name+' apunta'+'.'.repeat(1+Math.floor(t*3)%3);col=COL.flag}
    else if(p.isAI){mainT='El enemigo apunta'+'.'.repeat(1+Math.floor(t*3)%3);col=COL.flag}
    else mainT=g.rules.challenge?'Desafío':(g.np>1?'Turno de '+p.name:'Tu turno');
    if(g.rules.salvo)sub=p.isAI?'SALVA ENEMIGA: '+g.shotsLeft+' DISPAROS':'SALVA: '+g.sel.length+' / '+g.shotsLeft+' CASILLAS ELEGIDAS';

function costTag(own,eq,cost,unlock){
  if(eq)return '<div class="tg" style="color:var(--kelp)">'+ic('check')+' En uso</div>';
  if(own)return '<div class="tg" style="color:var(--mist)">Tuyo · pulsa para usar</div>';

  return '<div class="tg" style="color:'+(SV.pearls>=cost?'var(--signal)':'var(--mist)')+'">'+ic('pearl')+' '+cost+' perlas</div>';
}

/* ───── Manual del oficial: láminas ilustradas, teclado dibujado y poco texto ───── */
const KB_GROUPS={
  move:{c:'#4fb3d9',l:'Mover el cursor por la carta'},fire:{c:'#ffc93c',l:'Colocar el buque o disparar'},
  ship:{c:'#5fd3a8',l:'Elegir buque al colocar'},rot:{c:'#7aa7ff',l:'Girar el buque'},
  pow:{c:'#f07a3a',l:'Usar el poder del almirante'},salvo:{c:'#e8492f',l:'Lanzar la salva'},
  visor:{c:'#b28cff',l:'Visor de la IA'},pause:{c:'#93aeb8',l:'Pausa'}};
const KB_MAP={'1':'ship','2':'ship','3':'ship','4':'ship','5':'ship',R:'rot',E:'pow',F:'salvo',V:'visor',P:'pause',Esc:'pause',Enter:'fire',Espacio:'fire','↑':'move','↓':'move','←':'move','→':'move'};
const KB_EVT={Escape:'Esc',Enter:'Enter',' ':'Espacio',ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→'};
function keyboardSvg(){
  const u=40,g=5,rows=[
    [['Esc',1],['1',1],['2',1],['3',1],['4',1],['5',1],['6',1],['7',1],['8',1],['9',1],['0',1],["'",1],['¿',1],['⌫',2]],
    [['Tab',1.5],['Q',1],['W',1],['E',1],['R',1],['T',1],['Y',1],['U',1],['I',1],['O',1],['P',1],['`',1],['+',1]],
    [['Bloq',1.75],['A',1],['S',1],['D',1],['F',1],['G',1],['H',1],['J',1],['K',1],['L',1],['Ñ',1],['´',1],['Ç',1]],
    [['⇧',1.25],['<',1],['Z',1],['X',1],['C',1],['V',1],['B',1],['N',1],['M',1],[',',1],['.',1],['-',1],['⇧',2.3]],
    [['Ctrl',1.5],['Win',1.25],['Alt',1.25],['Espacio',6.3],['AltGr',1.25],['Menú',1.25],['Ctrl',1.5]]];
  let out='',maxX=0;
  const key=(x,y,w,h,t)=>{const gid=KB_MAP[t]||'',G=KB_GROUPS[gid];const fs=t.length>3?11:t.length>1?12:15;
    out+='<g class="k'+(G?' on':'')+'" data-k="'+esc(t)+'"'+(G?' data-g="'+gid+'" style="--kc:'+G.c+'"':'')+'><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="5"/>'+
      '<text x="'+(x+(t.length>1?9:w/2))+'" y="'+(y+(t.length>1?h-11:h/2+5))+'" font-size="'+fs+'"'+(t.length>1?'':' text-anchor="middle"')+'>'+esc(t)+'</text></g>'};
  rows.forEach((r,ri)=>{let x=0;const y=ri*(u+g);r.forEach(([t,w])=>{const W_=w*u+(w-1)*g;key(x,y,W_,u,t);x+=W_+g});maxX=Math.max(maxX,x)});
  /* Enter en L (teclado ISO) */
  const ey=u+g;out+='<g class="k on" data-k="Enter" data-g="fire" style="--kc:'+KB_GROUPS.fire.c+'"><path d="M'+(maxX-g-1.6*u)+' '+ey+'h'+(1.6*u)+'v'+(2*u+g)+'h-'+(1.25*u)+'v-'+(u+g)+'h-'+(.35*u)+'z"/><text x="'+(maxX-g-1.35*u)+'" y="'+(ey+u-12)+'" font-size="12">Enter</text></g>';
  const ax=maxX+u*.5,ay=3*(u+g);
  key(ax+u+g,ay,u,u,'↑');key(ax,ay+u+g,u,u,'←');key(ax+u+g,ay+u+g,u,u,'↓');key(ax+2*(u+g),ay+u+g,u,u,'→');
  const VW=ax+3*u+2*g+2,VH=5*(u+g);
  return '<svg class="kb" viewBox="-2 -2 '+(VW+4)+' '+(VH+2)+'" style="aspect-ratio:'+(VW+4)+'/'+(VH+2)+'" role="img" aria-label="Teclado con las teclas del juego resaltadas por colores">'+out+'</svg>';
}
/* Mini cartas dibujadas en SVG para las láminas */
function miniBoard(n,draw,o){
  o=o||{};const c=24,s=n*c;let h='<svg class="mini" viewBox="-1 -1 '+(s+2)+' '+(s+2)+'" aria-hidden="true"><rect width="'+s+'" height="'+s+'" fill="#123d50"/>';
  for(let i=1;i<n;i++)h+='<path d="M'+i*c+' 0V'+s+'M0 '+i*c+'H'+s+'" stroke="rgba(233,239,233,.13)"/>';
  h+=draw(c);return h+'<rect width="'+s+'" height="'+s+'" fill="none" stroke="#e9efe9" stroke-opacity=".5"/></svg>';
}
const mShip=(c,x,y,len,dir,col,sunk)=>{const w=dir==='h'?len*c-6:c-8,h=dir==='h'?c-8:len*c-6,X=x*c+(dir==='h'?3:4),Y=y*c+(dir==='h'?4:3);
  return '<rect x="'+X+'" y="'+Y+'" width="'+w+'" height="'+h+'" rx="'+(Math.min(w,h)/2)+'" fill="'+(col||'#a9b6bb')+'" stroke="#e9efe9" stroke-width="1.2"'+(sunk?' opacity=".55"':'')+'/>'};
const mWater=(c,x,y)=>'<circle cx="'+(x*c+c/2)+'" cy="'+(y*c+c/2)+'" r="2.4" fill="#e9efe9"/><circle cx="'+(x*c+c/2)+'" cy="'+(y*c+c/2)+'" r="6.5" fill="none" stroke="#e9efe9" stroke-opacity=".35"/>';
const mHit=(c,x,y,col)=>{const X=x*c+c/2,Y=y*c+c/2,k=5.5;return '<circle cx="'+X+'" cy="'+Y+'" r="9" fill="'+(col||'#e8492f')+'" opacity=".22"/><path d="M'+(X-k)+' '+(Y-k)+'L'+(X+k)+' '+(Y+k)+'M'+(X+k)+' '+(Y-k)+'L'+(X-k)+' '+(Y+k)+'" stroke="'+(col||'#e8492f')+'" stroke-width="3"/>'};
const mHatch=(c,x,y)=>'<rect x="'+x*c+'" y="'+y*c+'" width="'+c+'" height="'+c+'" fill="url(#hatch)"/>';
const HATCH='<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="rgba(7,24,32,.55)"/><path d="M0 0V6" stroke="#e8492f" stroke-width="2"/></pattern></defs>';
function fleetLine(){
  return '<div class="fleetline">'+FLEET.map(f=>'<div class="fl"><div class="cells">'+'<i></i>'.repeat(f.size)+'</div><b>'+f.n+'</b><span>'+f.size+' casillas</span></div>').join('')+'</div>';
}

    ['Sonar: barco',miniBoard(1,c=>'<path d="M12 5L19 12L12 19L5 12Z" fill="none" stroke="#5fd3a8" stroke-width="2"/>')],['Sonar: agua',miniBoard(1,c=>'<circle cx="12" cy="12" r="6" fill="none" stroke="#5fd3a8" stroke-width="1.6" stroke-dasharray="2.5 2.5"/>')]];

  const body='<div class="manual">'+
   plate('hero','Hunde la flota enemiga antes de que hundan la tuya','<p class="lead">Cada flota tiene cinco buques, en horizontal o vertical. Pueden tocarse, pero no superponerse.</p>'+fleetLine())+
   plate('step',"Coloca",step1+'<p>Toca la carta para poner cada buque. '+kbd('R')+' lo gira.</p>','1')+
   plate('step','Dispara',step2+'<p>Elige una casilla de la carta enemiga. Si aciertas, repites.</p>','2')+
   plate('step','Hunde',step3+'<p>Cuando aciertas todas sus casillas, el buque se hunde.</p>','3')+
   plate('keys','Teclado','<p class="hint">Pulsa cualquier tecla para ver si el juego la usa.</p><div class="kbwrap">'+keyboardSvg()+'</div>'+
     '<ul class="kleg">'+Object.entries(KB_GROUPS).map(([k,G])=>'<li data-g="'+k+'" style="--kc:'+G.c+'"><i></i>'+G.l+'</li>').join('')+'</ul>'+
     '<div class="touch"><span>'+ic('target')+' Clic o toque: elegir casilla</span><span>'+ic('rotate')+' Clic derecho: girar</span></div>')+
   plate('marks','Marcas de la carta','<div class="legend">'+legend.map(l=>'<div>'+l[1]+'<span>'+l[0]+'</span></div>').join('')+'</div><p>Se distinguen por la forma, no solo por el color.</p>')+
   plate('modes','Misiones','<div class="mtiles">'+MODE_KEYS.map(k=>'<div>'+iso(MODE_ISO[k],'big')+'<b>'+MODES[k].n+'</b><span>'+(MODES[k].short||MODES[k].d)+'</span></div>').join('')+'</div>')+
   plate('adm','Almirantes','<div class="charge"><span>Acierto</span><i style="--w:25%"></i><span>Hundimiento</span><i style="--w:45%"></i><span>Poder listo</span><i style="--w:100%"></i></div>'+
     '<div class="atiles">'+ADM.map(a=>'<div>'+admTag(a.id,'width:2.6em;height:3em')+'<b style="color:'+a.col+'">'+a.n+'</b><span>'+a.pn+'</span></div>').join('')+'</div>')+
   plate('pts','Puntos y perlas','<div class="formula"><div><b>+100</b><span>por impacto, ×1,25 por cada acierto seguido</span></div><div><b>+320</b><span>o más, al hundir un buque</span></div><div><b>+1000</b><span>al ganar, más bonus por precisión</span></div><div class="eq">'+ic('pearl')+'<span>Todo se convierte en perlas para el Arsenal</span></div></div>')+
   plate('ai','Rivales','<div class="aitiles"><div>'+heat((x,y)=>((x*7+y*13)%5===0)?.5:0)+'<b>Fácil</b><span>Dispara casi al azar</span></div><div>'+heat((x,y)=>(x+y)%2?0:.45+.1*((x*y)%3))+'<b>Normal</b><span>Busca en damero y remata</span></div><div>'+heat((x,y)=>Math.max(0,1-Math.hypot(x-2.5,y-2.8)/3.6))+'<b>Difícil</b><span>Calcula dónde es más probable</span></div></div><p>Nunca mira tu flota. Actívale el visor con '+kbd('V')+'.</p>')+

  showOV(screen('Cómo jugar','Manual del oficial',body).replace('class="scr"','class="scr wide"'));

/* Teclado vivo: en el manual, las teclas pulsadas se iluminan */
document.addEventListener('keydown',e=>{
  if(UI.screen!=='help'||!ovOpen())return;const svg=OV.querySelector('svg.kb');if(!svg)return;
  const name=KB_EVT[e.key]||(e.key.length===1?e.key.toUpperCase():e.key);

  if(tip)tip.innerHTML=gid?'<b style="color:'+KB_GROUPS[gid].c+'">'+esc(name)+'</b> · '+KB_GROUPS[gid].l:esc(name)+' · esta tecla no tiene uso en el juego';
});

/* ═══════════════ PARTIDA EN LÍNEA ═══════════════
   Dos transportes con la misma interfaz {send(msg), close()}:
   · PeerJS (WebRTC directo entre navegadores) en el archivo HTML.
   · `room` de Claude en el artifact: mensajes fiables sobre la presencia de la sala (sin pérdidas, en orden).
   Protocolo: cada jugador guarda su flota en su propio navegador. Los disparos se resuelven en el
   navegador del defensor, que responde con el resultado. Al empezar se envía un compromiso SHA-256 de
   la flota y al terminar se revela para que el otro compruebe que nadie movió sus barcos. */
const NET_V=3,PEER_PFX='flota-abisal-v3-';
const NET={kind:null,tr:null,role:null,pin:'',seq:0,pend:{},q:[],pumping:false,status:'off',peer:null,cfg:null,
  myHash:'',mySalt:'',theirHash:'',theirReady:false,lostT:0};
const netAvail=()=>!!(window.claude&&typeof window.claude.use==='function')?'room':(typeof Peer==='function'?'peer':'');
const newPin=()=>String(Math.floor(100000+Math.random()*900000));
function netSend(m){try{NET.tr&&NET.tr.send(m)}catch(e){console.warn(e)}}
function netReq(t,data){const id=++NET.seq;netSend({...data,t,id});return new Promise(res=>{NET.pend[id]={res,at:Date.now()}})}
function netRecv(m){
  if(!m||typeof m!=='object'||typeof m.t!=='string')return;
  if(m.t==='res'){const p=NET.pend[m.id];if(p){delete NET.pend[m.id];p.res(m.r||{})}return}
  NET.q.push(m);netPump();
}
async function netPump(){
  if(NET.pumping)return;NET.pumping=true;
  while(NET.q.length){const m=NET.q.shift();const h=NET_H[m.t];if(h){try{await h(m)}catch(e){console.error('net',m.t,e)}}}
  NET.pumping=false;
}
function netSetStatus(s,txt){NET.status=s;const el=$('netst');if(el){el.className='netst '+s;el.querySelector('span').textContent=txt}}
function netClose(){try{NET.tr&&NET.tr.close()}catch(e){}NET.tr=null;NET.status='off';NET.q.length=0;NET.pend={};NET.theirReady=false;NET.theirHash='';NET.peer=null}

/* ── Transporte 1: PeerJS ── */
function peerTransport(pin,host){
  return new Promise((resolve,reject)=>{
    const opts=window.FA_PEER_CFG||{debug:0};let conn=null,done=false;
    const peer=host?new Peer(PEER_PFX+pin,opts):new Peer(undefined,opts);
    const tr={send:m=>{if(conn&&conn.open)conn.send(m)},close:()=>{try{conn&&conn.close()}catch(e){}try{peer.destroy()}catch(e){}}};
    const wire=c=>{conn=c;c.on('data',netRecv);c.on('open',()=>{if(!done){done=true;resolve(tr)}netConnected()});c.on('close',()=>netLost());c.on('error',()=>netLost())};
    peer.on('error',e=>{const t=e&&e.type;if(!done){done=true;reject(t==='unavailable-id'?'taken':t==='peer-unavailable'?'nopin':t==='network'||t==='server-error'||t==='socket-error'?'net':'net')}else if(t==='peer-unavailable')netLost()});
    peer.on('open',()=>{if(host){netSetStatus('wait','Esperando a tu rival');resolve(tr);done=true}else wire(peer.connect(PEER_PFX+pin,{reliable:true}))});
    if(host)peer.on('connection',c=>{if(conn&&conn.open){c.on('open',()=>{c.send({t:'full'});setTimeout(()=>c.close(),300)});return}wire(c)});
    setTimeout(()=>{if(!done){done=true;tr.close();reject(host?'net':'nopin')}},host?15000:12000);
  });
}
/* ── Transporte 2: sala de Claude (presencia como buzón con acuses) ── */
async function roomTransport(pin,host){
  const room=await window.claude.use('room');if(!room)throw 'noroom';
  const R=await room.join('flota-'+pin);
  let out=[],mySeq=0,got=0,opp=null,closed=false;
  let last='';const push=()=>{const st={v:NET_V,role:host?'host':'guest',out,ack:got},j=JSON.stringify(st);if(j===last)return;last=j;R.presence({fa:st}).catch(()=>{})};
  const tr={send:m=>{out.push({s:++mySeq,m});push()},close:()=>{closed=true;R.leave().catch(()=>{})}};
  push();
  return await new Promise((resolve,reject)=>{
    let ok=false;
    R.onPeers(ch=>{
      if(closed)return;
      if(opp&&ch.left.some(p=>p.peer===opp)){netLost();return}
      const cand=ch.peers.filter(p=>!p.isMe&&p.presence&&p.presence.fa&&p.presence.fa.role===(host?'guest':'host'));
      const o=cand.find(p=>p.peer===opp)||(!opp&&cand[0]);if(!o)return;
      if(!opp){opp=o.peer;if(!ok){ok=true;resolve(tr)}netConnected()}
      const fa=o.presence.fa;if(!Array.isArray(fa.out))return;
      for(const e of fa.out){if(e&&e.s===got+1){got=e.s;netRecv(e.m)}}
      out=out.filter(e=>e.s>(+fa.ack||0));push();
    },()=>{if(!ok){ok=true;reject('noroom')}else netLost()});
    if(host){ok=true;resolve(tr);netSetStatus('wait','Esperando a tu rival')}
    else setTimeout(()=>{if(!ok){ok=true;tr.close();reject('nopin')}},9000);
  });
}
async function netOpen(host,pin){
  netClose();NET.role=host?'host':'guest';NET.pin=pin;NET.kind=netAvail();
  netSetStatus('conn',host?'Abriendo la sala':'Buscando la sala '+pin);
  try{NET.tr=NET.kind==='room'?await roomTransport(pin,host):await peerTransport(pin,host)}
  catch(e){NET.tr=null;
    if(e==='taken'&&host)return netOpen(true,newPin());
    const msg={nopin:'No hay ninguna sala abierta con el PIN '+pin+'. Revisa los números.',noroom:'Para jugar en línea desde Claude, los dos necesitan abrir este juego con su sesión iniciada.',net:'No hay conexión con el servidor de enlace. Revisa tu internet.'}[e]||'No se pudo conectar.';
    netSetStatus('err',msg);sfx('error');return false}
  if(host){const el=$('netpin');if(el)el.innerHTML=pinDigits(NET.pin);netShowInvite()}
  return true;
}
function netConnected(){setTimeout(netConnected2,30)}
function netConnected2(){
  netSetStatus('ok','Conectado');sfx('ready');
  netSend({t:'hello',v:NET_V,name:(SV.name||'PILOTO').slice(0,16),adm:SV.adm,fleet:SV.fleet,ensign:SV.ensign});
}
function netLost(){
  if(NET.status==='off'||NET.status==='lost')return;NET.status='lost';
  netSetStatus('err','Se perdió la conexión con tu rival');

async function fleetHash(fleet,salt){
  const txt=JSON.stringify(fleet.map(s=>s?[s.r,s.c,s.dir]:null))+'|'+salt;
  try{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=2166136261;for(let i=0;i<txt.length;i++){h^=txt.charCodeAt(i);h=Math.imul(h,16777619)}return 'f'+(h>>>0).toString(16)}
}

function updateGame(dt){
  const g=game;
  if(g.phase==='battle'&&!g.over)g.time+=dt;
  if(g.aiThink)g.aiThink.t+=dt;
  if(g.rules.timer&&isHumanTurn()&&!g.busy&&!ovOpen()){
    g.turnT-=dt;const s=Math.ceil(g.turnT);if(s<=3&&s>0&&s!==g.tickN){g.tickN=s;sfx('tick')}
    if(g.turnT<=0)timeout();
  }
}
function tickAnims(dt){for(let i=anims.length-1;i>=0;i--){const a=anims[i];a.t+=dt;if(a.t>=a.dur){anims.splice(i,1);a.res()}}}
let lastTs=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,Math.max(0,(ts-lastTs)/1000)||.016);lastTs=ts;const t=ts/1000;
  D=DM;D.setTransform(DPR,0,0,DPR,0,0);
  try{
    if(!paused){tickWaits(dt);tickAnims(dt);tickFx(dt);if(game&&scene==='game')updateGame(dt)}
    drawBg(t,scene==='game');
    if(scene==='game'&&game)drawGame(t);
    if(ovOpen())drawPreviews(t,OV);
    if($('cf').classList.contains('show'))drawPreviews(t,$('cf'));
    if(scene==='game')drawPreviews(t,$('bar'));
  }catch(err){console.error(err);D=DM}
}
